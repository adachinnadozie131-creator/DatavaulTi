
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buy Data - DataVaulti</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f5f7f6;
      color: #17211b;
    }

    .header {
      background: #0b8f4d;
      color: white;
      padding: 22px 18px;
      border-radius: 0 0 22px 22px;
    }

    .header h1 {
      margin: 0;
      font-size: 24px;
    }

    .header p {
      margin: 6px 0 0;
      opacity: 0.9;
    }

    .container {
      padding: 20px 16px 100px;
    }

    .card {
      background: white;
      padding: 18px;
      border-radius: 18px;
      margin-bottom: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    }

    .card h2 {
      font-size: 17px;
      margin-top: 0;
    }

    .networks {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .network {
      padding: 14px;
      border: 2px solid #e1e6e3;
      border-radius: 12px;
      background: white;
      font-weight: bold;
      cursor: pointer;
    }

    .network.selected {
      border-color: #0b8f4d;
      background: #eaf8f0;
      color: #0b8f4d;
    }

    select,
    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #d9dfdc;
      border-radius: 12px;
      font-size: 15px;
      margin-top: 8px;
      background: white;
    }

    label {
      font-weight: bold;
      font-size: 14px;
    }

    .summary {
      background: #eaf8f0;
      padding: 15px;
      border-radius: 12px;
      margin-top: 15px;
    }

    .summary div {
      display: flex;
      justify-content: space-between;
      margin: 8px 0;
    }

    .continue {
      width: 100%;
      border: none;
      background: #0b8f4d;
      color: white;
      padding: 16px;
      border-radius: 14px;
      font-size: 16px;
      font-weight: bold;
      margin-top: 15px;
      cursor: pointer;
    }

    .nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: white;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      padding: 10px 5px;
      box-shadow: 0 -3px 15px rgba(0,0,0,0.08);
    }

    .nav a {
      text-align: center;
      text-decoration: none;
      color: #555;
      font-size: 12px;
      padding: 5px;
    }

    .nav a.active {
      color: #0b8f4d;
      font-weight: bold;
    }

    .nav-icon {
      display: block;
      font-size: 20px;
      margin-bottom: 3px;
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>Buy Data</h1>
    <p>Choose your network and data plan</p>
  </div>

  <div class="container">

    <div class="card">
      <h2>1. Select Network</h2>

      <div class="networks">
        <button class="network selected" onclick="selectNetwork(this, 'MTN')">MTN</button>
        <button class="network" onclick="selectNetwork(this, 'Airtel')">Airtel</button>
        <button class="network" onclick="selectNetwork(this, 'Glo')">Glo</button>
        <button class="network" onclick="selectNetwork(this, '9mobile')">9mobile</button>
      </div>
    </div>

    <div class="card">
      <h2>2. Select Data Plan</h2>

      <label for="plan">Data plan</label>

      <select id="plan" onchange="updatePrice()">
        <option value="200">500MB — ₦200</option>
        <option value="350">1GB — ₦350</option>
        <option value="650">2GB — ₦650</option>
        <option value="1500">5GB — ₦1,500</option>
      </select>
    </div>

    <div class="card">
      <h2>3. Recipient Number</h2>

      <label for="phone">Phone number</label>
      <input
        id="phone"
        type="tel"
        placeholder="08012345678"
        maxlength="11"
      >

      <div class="summary">
        <div>
          <span>Network</span>
          <strong id="selectedNetwork">MTN</strong>
        </div>

        <div>
          <span>Amount</span>
          <strong id="selectedPrice">₦200</strong>
        </div>
      </div>

      <button class="continue" onclick="continueOrder()">
        Continue
      </button>
    </div>

  </div>

  <div class="nav">
    <a href="index.html">
      <span class="nav-icon">⌂</span>
      Home
    </a>

    <a href="buy-data.html" class="active">
      <span class="nav-icon">📱</span>
      Buy Data
    </a>

    <a href="#">
      <span class="nav-icon">🧾</span>
      History
    </a>

    <a href="account.html">
      <span class="nav-icon">👤</span>
      Account
    </a>
  </div>

  <script>
    let network = "MTN";

    function selectNetwork(button, name) {
      document.querySelectorAll(".network").forEach(btn => {
        btn.classList.remove("selected");
      });

      button.classList.add("selected");

      network = name;
      document.getElementById("selectedNetwork").textContent = name;
    }

    function updatePrice() {
      const plan = document.getElementById("plan");
      const price = Number(plan.value);

      document.getElementById("selectedPrice").textContent =
        "₦" + price.toLocaleString();
    }

    function continueOrder() {
      const phone = document.getElementById("phone").value.trim();
      const plan = document.getElementById("plan");
      const price = Number(plan.value);

      if (phone.length !== 11) {
        alert("Please enter a valid 11-digit phone number.");
        return;
      }

      alert(
        "Order ready!\\n\\n" +
        "Network: " + network + "\\n" +
        "Plan: " + plan.options[plan.selectedIndex].text + "\\n" +
        "Phone: " + phone + "\\n" +
        "Amount: ₦" + price.toLocaleString()
      );
    }
  </script>

</body>
</html>
