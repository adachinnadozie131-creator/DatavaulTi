
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Confirm Order - DatavaulTi</title>

  <!-- Paystack -->
  <script src="https://js.paystack.co/v1/inline.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7f6;
      color: #222;
    }

    .container {
      max-width: 500px;
      margin: 50px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    h1 {
      text-align: center;
      color: #087f23;
      margin-bottom: 25px;
    }

    .row {
      display: flex;
      justify-content: space-between;
      padding: 14px 0;
      border-bottom: 1px solid #eee;
    }

    .label {
      color: #666;
    }

    .value {
      font-weight: bold;
    }

    .total {
      font-size: 20px;
      color: #087f23;
      margin-top: 10px;
    }

    .pay {
      width: 100%;
      padding: 15px;
      margin-top: 25px;
      border: none;
      border-radius: 10px;
      background: #087f23;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .pay:hover {
      opacity: 0.9;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 18px;
      color: #087f23;
      text-decoration: none;
    }

    .note {
      margin-top: 20px;
      padding: 12px;
      background: #f0f8f2;
      border-radius: 8px;
      font-size: 13px;
      color: #555;
      text-align: center;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="card">

      <h1>Confirm Your Order</h1>

      <div class="row">
        <span class="label">Network</span>
        <span class="value" id="network">MTN</span>
      </div>

      <div class="row">
        <span class="label">Data Plan</span>
        <span class="value" id="plan">1GB</span>
      </div>

      <div class="row">
        <span class="label">Phone Number</span>
        <span class="value" id="phone">08012345678</span>
      </div>

      <div class="row total">
        <span>Total</span>
        <span id="amount">₦350</span>
      </div>

      <button class="pay" onclick="confirmPayment()">
        Confirm & Pay
      </button>

      <a class="back" href="buy-data.html">
        ← Back to Buy Data
      </a>

      <div class="note">
        You are currently using Paystack Test Mode.
      </div>

    </div>

  </div>

  
    <script>
  const params = new URLSearchParams(window.location.search);

  const network = params.get("network") || "MTN";
  const plan = params.get("plan") || "1GB";
  const phone = params.get("phone") || "08012345678";
  const amount = params.get("amount") || "350";

  document.getElementById("network").textContent = network;
  document.getElementById("plan").textContent = plan;
  document.getElementById("phone").textContent = phone;
  document.getElementById("amount").textContent =
    "₦" + Number(amount).toLocaleString();
function confirmPayment() {
  const handler = PaystackPop.setup({
    key: "pk_test_fd16bc0b3e2d7ad15a7db24bfa32a5fccf104a22",
    email: "adachinnadozie131@gmail.com",
    amount: Number(amount) * 100,
    currency: "NGN",

    callback: function(response) {
      alert(
        "Payment successful!\nReference: " +
        response.reference
      );
    },

    onClose: function() {
      alert("Payment window closed.");
    }
  });

  handler.openIframe();
}
  
</script>

</body>
</html>
