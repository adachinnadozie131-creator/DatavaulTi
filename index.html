<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DataVaulti</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
}

body {
  background: #f6f8fb;
  color: #172033;
  padding-bottom: 80px;
}

/* HEADER */

.header {
  background: #111827;
  color: white;
  padding: 22px 20px 30px;
  border-radius: 0 0 25px 25px;
}

.logo {
  font-size: 24px;
  font-weight: 800;
}

.logo span {
  color: #22c55e;
}

.header p {
  margin-top: 7px;
  color: #d1d5db;
  font-size: 14px;
}

/* CONTAINER */

.container {
  max-width: 520px;
  margin: auto;
  padding: 18px;
}

/* BALANCE CARD */

.balance {
  background: white;
  padding: 20px;
  border-radius: 18px;
  margin-top: -5px;
  box-shadow: 0 5px 20px rgba(0,0,0,0.08);
}

.balance small {
  color: #6b7280;
}

.balance h2 {
  margin-top: 7px;
  font-size: 27px;
}

/* SECTION */

.section {
  margin-top: 25px;
}

.section-title {
  font-size: 19px;
  font-weight: 700;
  margin-bottom: 14px;
}

/* NETWORKS */

.networks {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.network {
  border: none;
  background: white;
  padding: 17px;
  border-radius: 15px;
  font-size: 16px;
  font-weight: 700;
  box-shadow: 0 3px 12px rgba(0,0,0,0.06);
}

/* DATA PLANS */

.plans {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.plan {
  background: white;
  padding: 18px;
  border-radius: 15px;
  border: 1px solid #e5e7eb;
  text-align: left;
}

.plan strong {
  font-size: 19px;
}

.plan p {
  color: #6b7280;
  margin-top: 6px;
  font-size: 13px;
}

.plan b {
  display: block;
  margin-top: 10px;
  font-size: 17px;
}

/* BUY SECTION */

.buy-card {
  background: white;
  padding: 20px;
  border-radius: 18px;
  margin-top: 25px;
}

input {
  width: 100%;
  padding: 16px;
  border: 1px solid #d1d5db;
  border-radius: 12px;
  font-size: 16px;
  margin-top: 10px;
}

.buy-button {
  width: 100%;
  border: none;
  background: #16a34a;
  color: white;
  padding: 17px;
  border-radius: 12px;
  font-size: 17px;
  font-weight: 700;
  margin-top: 15px;
}

/* MESSAGE */

#message {
  text-align: center;
  margin-top: 15px;
  font-weight: 600;
}

/* BOTTOM NAV */

.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: 65px;
  background: white;
  border-top: 1px solid #e5e7eb;
  display: flex;
  justify-content: space-around;
  align-items: center;
}

.nav-item {
  text-align: center;
  color: #6b7280;
  font-size: 12px;
}

.nav-item.active {
  color: #16a34a;
  font-weight: 700;
}

.nav-icon {
  font-size: 21px;
  display: block;
  margin-bottom: 3px;
}
</style>
</head>

<body>

<header class="header">

  <div class="logo">
    Data<span>Vaulti</span>
  </div>

  <p>Fast, simple and reliable data.</p>

</header>


<main class="container">

  <!-- BALANCE -->

  <div class="balance">

    <small>Wallet Balance</small>

    <h2>₦0.00</h2>

  </div>


  <!-- NETWORKS -->

  <section class="section">

    <div class="section-title">
      Choose Network
    </div>

    <div class="networks">

      <button class="network" onclick="selectNetwork('MTN')">
        🟡 MTN
      </button>

      <button class="network" onclick="selectNetwork('Airtel')">
        🔴 Airtel
      </button>

      <button class="network" onclick="selectNetwork('Glo')">
        🟢 Glo
      </button>

      <button class="network" onclick="selectNetwork('9mobile')">
        🟢 9mobile
      </button>

    </div>

    <p id="networkMessage"></p>

  </section>


  <!-- PLANS -->

  <section class="section">

    <div class="section-title">
      Popular Data Plans
    </div>

    <div class="plans">

      <button class="plan" onclick="selectPlan('500MB', 200)">

        <strong>500MB</strong>

        <p>30 Days</p>

        <b>₦200</b>

      </button>


      <button class="plan" onclick="selectPlan('1GB', 350)">

        <strong>1GB</strong>

        <p>30 Days</p>

        <b>₦350</b>

      </button>


      <button class="plan" onclick="selectPlan('2GB', 650)">

        <strong>2GB</strong>

        <p>30 Days</p>

        <b>₦650</b>

      </button>


      <button class="plan" onclick="selectPlan('5GB', 1500)">

        <strong>5GB</strong>

        <p>30 Days</p>

        <b>₦1,500</b>

      </button>

    </div>

  </section>


  <!-- BUY -->

  <div class="buy-card">

    <div class="section-title">
      Buy Data
    </div>

    <input
      type="tel"
      id="phone"
      placeholder="Enter recipient phone number"
      maxlength="11"
    >

    <button
      class="buy-button"
      onclick="buyData()"
    >
      Continue
    </button>

    <p id="message"></p>

  </div>

</main>


<!-- BOTTOM NAV -->

<nav class="bottom-nav">

  <div class="nav-item active">
    <span class="nav-icon">⌂</span>
    Home
  </div>

  <div class="nav-item">
    <span class="nav-icon">📱</span>
    Buy Data
  </div>

  <div class="nav-item">
    <span class="nav-icon">🧾</span>
    History
  </div>

  <div class="nav-item">
    <span class="nav-icon">👤</span>
    Account
  </div>

</nav>


<script>

let selectedNetwork = "";
let selectedPlan = "";
let selectedPrice = 0;


function selectNetwork(network) {

  selectedNetwork = network;

  document.getElementById("networkMessage").innerText =
    "Selected: " + network;

}


function selectPlan(plan, price) {

  selectedPlan = plan;

  selectedPrice = price;

  document.getElementById("message").innerText =
    plan + " selected — ₦" + price;

}


function buyData() {

  const phone =
    document.getElementById("phone").value;

  const message =
    document.getElementById("message");


  if (!selectedNetwork) {

    message.innerText =
      "Please choose a network.";

    return;

  }


  if (!selectedPlan) {

    message.innerText =
      "Please choose a data plan.";

    return;

  }


  if (phone.length !== 11) {

    message.innerText =
      "Enter a valid 11-digit phone number.";

    return;

  }


  message.innerText =
    "Order ready: " +
    selectedPlan +
    " " +
    selectedNetwork +
    " for " +
    phone +
    " — ₦" +
    selectedPrice;

}

</script>

</body>
</html>
